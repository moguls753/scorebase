services:
  # CloudflareBypassForScraping: solves Cloudflare for all scraping.
  # Used by CpdlImporter (CPDL MediaWiki API) and HttpDownloadable (file downloads).
  cloudflare-bypass:
    image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
    container_name: cloudflare-bypass
    ports:
      - "8000:8000"
    restart: unless-stopped
