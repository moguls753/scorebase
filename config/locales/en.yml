    back_to_search: "Back to Search"
    imslp_name: "International Music Score Library Project"
    imslp_description: "Also known as the Petrucci Music Library. The largest collection of sheet music with over 800,000 scores from 27,000+ composers."
    cpdl_name: "Choral Public Domain Library"
    cpdl_description: "Also known as ChoralWiki. The largest site for choral sheet music, with strong coverage of Renaissance and Baroque vocal works."
    pdmx_name: "Public Domain MusicXML"
    pdmx_description: "A research dataset of 250K+ MusicXML files collected from MuseScore. Useful for notation software like MuseScore, Sibelius, or Finale."
    openscore_name: "OpenScore"
    openscore_description: "High-quality encodings of 19th-century art songs and string quartets. Includes works by Schubert, Schumann, Brahms, Beethoven, and more."
    smd_name: "Sheet Music Direct"
    smd_description: "Digital sheet music platform by Hal Leonard, the world's largest print music publisher. Over 1 million licensed arrangements across pop, rock, film, and Broadway. Commercial scores available for purchase."
    transparency_title: "Why Pro?"
