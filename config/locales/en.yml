    waitlist_subtitle: "Drop your email to hear when it's ready."
    waitlist_email_placeholder: "your@email.com"
    waitlist_button: "Notify Me"
    waitlist_sending: "Sending..."
    waitlist_disclaimer: "I'll email you when Pro is ready. No spam."

    # FAQ section (kept for Schema.org FAQPage SEO)
    faq_title: "Questions"
    faq_1_q: "Is Smart Search available now?"
    faq_1_a: "Yes — the public beta is live. Free tier is 5 searches/day per IP, no account required. The Pro tier (€2/mo, 100 searches/day) is in the works."
    faq_2_q: "Can I try it for free?"
    faq_2_a: "Yes. The public beta is live with 5 free searches/day per IP. No account, no credit card. The full catalog with regular keyword search stays free forever."
    faq_3_q: "How is this different from IMSLP?"
    faq_3_a: "IMSLP is a score archive with keyword search. ScoreBase aggregates multiple sources (IMSLP, CPDL, OpenScore, and more) and adds Smart Search that understands musical context: difficulty, ranges, duration, style."
    faq_4_q: "Can I cancel anytime?"
    faq_4_a: "Yes. No long-term commitment. Cancel whenever you want."
    faq_5_q: "Why does Pro cost money?"
    faq_5_a: "The beta is free with 5 searches/day per IP. Pro (€2/mo, 100 searches/day) covers the AI infrastructure costs while the free catalog stays open to everyone."

    # Footer
    back_to_catalog: "← Back to Free Catalog"

