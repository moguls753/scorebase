      heading: "Smart Search hat das heutige Tageslimit erreicht"
      body_html: "Smart Search hat während der öffentlichen Beta ein tägliches Limit für die ganze Seite. Das Limit wird täglich um Mitternacht UTC zurückgesetzt. Die reguläre Suche kannst du weiterhin ohne Limit nutzen."
