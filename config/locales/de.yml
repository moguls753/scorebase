    faq_title: "Fragen"
    faq_1_q: "Ist Smart Search schon verfügbar?"
    faq_1_a: "Ja – die öffentliche Beta ist live. Free-Tarif: 5 Suchen pro Tag und IP, kein Account nötig. Der Pro-Tarif (2 €/Monat, 100 Suchen/Tag) ist in Arbeit."
    faq_2_q: "Kann ich es gratis testen?"
    faq_2_a: "Ja. Die öffentliche Beta ist live mit 5 kostenlosen Suchen pro Tag und IP. Kein Account, keine Kreditkarte. Der volle Katalog mit normaler Stichwortsuche bleibt für immer kostenlos."
    faq_3_q: "Was ist der Unterschied zu IMSLP?"
    faq_3_a: "IMSLP ist ein Noten-Archiv mit Stichwortsuche. ScoreBase vereint mehrere Quellen (IMSLP, CPDL, OpenScore und mehr) und fügt Smart Search hinzu, die musikalischen Kontext versteht: Schwierigkeit, Stimmumfänge, Dauer, Stil."
    faq_4_q: "Kann ich jederzeit kündigen?"
    faq_4_a: "Ja. Keine Vertragsbindung. Kündige wann immer du willst."
    faq_5_q: "Warum kostet Pro Geld?"
    faq_5_a: "Die Beta ist kostenlos mit 5 Suchen pro Tag und IP. Pro (2 €/Monat, 100 Suchen/Tag) deckt die KI-Infrastruktur, während der freie Katalog für alle offen bleibt."

