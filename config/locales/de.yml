    label: "Info"
    title: "ScoreBase"
    subtitle: "Durchsuche Noten aus mehreren Archiven — alles an einem Ort."
    why_exists_title: "Warum?"
    why_exists_p1: "Noten sind über das Web verstreut."
    why_exists_p2: "ScoreBase bringt sie zusammen."
    sources_title: "Quellen"
    features_title: "Wie es funktioniert"
    feature_1_title: "Aggregierte Daten"
    feature_1_desc: "Noten von IMSLP, CPDL, OpenScore und mehr werden indexiert und sind an einem Ort durchsuchbar."
    feature_2_title: "Bereinigt & Angereichert"
    feature_2_desc: "Sauberere, verlässlichere Daten. KI standardisiert Informationen über alle Quellen und ergänzt fehlende Details."
    feature_3_title: "Interaktive Galerie"
    feature_3_desc: "Durchblättere die komplette Partitur vor dem Download. Mit Navigation, Tastaturkürzeln und Vollbildmodus."
    feature_4_title: "Intelligente Suche (Öffentliche BETA)"
    feature_4_desc: "KI-gestützte Suche in natürlicher Sprache, live in öffentlicher BETA. Beschreibe einfach, was du suchst – etwa 'barocke Violinsonaten' oder 'einfache Klavierstücke in C-Dur'."
    back_to_search: "Zurück zur Suche"
    imslp_name: "International Music Score Library Project"
    imslp_description: "Auch bekannt als Petrucci-Musikbibliothek. Die größte Sammlung von Noten mit über 800.000 Partituren von mehr als 27.000 Komponisten."
    cpdl_name: "Choral Public Domain Library"
    cpdl_description: "Auch bekannt als ChoralWiki. Die größte Seite für Chornoten, mit starker Abdeckung von Renaissance- und Barockvokalwerken."
    pdmx_name: "Public Domain MusicXML"
    pdmx_description: "Ein Datensatz mit über 250.000 MusicXML-Dateien von MuseScore. Nützlich für Notationssoftware wie MuseScore, Sibelius oder Finale."
    openscore_name: "OpenScore"
    openscore_description: "Hochwertige Kodierungen von Kunstliedern und Streichquartetten des 19. Jahrhunderts. Mit Werken von Schubert, Schumann, Brahms, Beethoven und mehr."
    smd_name: "Sheet Music Direct"
    smd_description: "Digitale Notenplattform von Hal Leonard, dem weltweit größten Notenverleger. Über 1 Million lizenzierte Arrangements aus Pop, Rock, Film und Broadway. Kommerzielle Noten zum Kauf."
    transparency_title: "Warum Pro?"
    transparency_p1: "Smart Search läuft auf KI. KI kostet Geld. Dein Abo hält es am Laufen, während der Katalog für alle kostenlos bleibt."

