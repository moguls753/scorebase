production:
  # clear_solid_queue_finished_jobs:
  #   command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
  #   schedule: every hour at minute 12

  aggregate_daily_stats:
    class: AggregateDailyStatsJob
    queue: default
    schedule: every hour

  sitemap_refresh:
    class: SitemapRefreshJob
    queue: default
    schedule: every week

  hub_cache_warm:
    class: HubCacheWarmJob
    queue: default
    schedule: every day at 4am

  purge_deleted_scores:
    class: PurgeDeletedScoresJob
    queue: default
    schedule: every sunday at 3am

  backfill_group_keys:
    class: BackfillGroupKeysJob
    queue: default
    schedule: every day at 2am

  # Imports land composers raw ("Billie Eilish"); this rewrites them to the
  # "Eilish, Billie" convention the composer hubs and ComposerMapping are built
  # on. Scoped to composer_status = pending and failures are terminal, so it is
  # a free no-op when nothing new has arrived. The limit caps LLM spend per run
  # after a large import — cache hits and pattern matches cost nothing, only
  # genuinely unseen names reach the API. Runs before the noon
  # backfill_smd_matches, which matches on composer surnames.
  normalize_composers:
    class: NormalizeComposersJob
    queue: default
    args: [ { limit: 2000 } ]
    schedule: every day at 1am

  # After the day's SMD work: reps 6am, catalogue 8am (~11:20 at 8000), import 11am. Off the hour
  # because aggregate_daily_stats fires hourly and has no retry, and the converge holds a
  # database-wide SQLite write lock past the 5s busy_timeout on a large diff.
  # Daily rather than triggered — a converge costs ~14s and both SMD jobs can change a match
  # (SmdRefreshJob rewrites title and price_usd, which build_index reads), so no per-job hook
  # would cover it without coupling every writer to this one.
  backfill_smd_matches:
    class: BackfillSmdMatchesJob
    queue: default
    schedule: every day at 12:01pm

  # SMD prices drift, and stale ones are quoted to buyers: a Jan-2026 import was
  # measured ~29% high across every sampled product. Both passes walk
  # smd_stalest_first, so each run continues where the last stopped and no row
  # can be starved.
  #
  # Representatives are sitemapped and average $40 a sale, so they keep their own
  # cadence — 1100/day cycles all 9,308 in 8.5 days. The catalogue pass covers
  # everything else at 8000/day; as of 2026-08-11 that is 194k rows never price-
  # checked since the Feb import, ~24 days to clear. At the 0.5-1.5s throttle that
  # is 2.2-3.3h, well inside the jobs' 12h concurrency semaphore. Raising it
  # further means switching SmdRefreshJob's `.limit(n).each` to batches first, so
  # the run stays inside the container's 1 GB.
  smd_refresh_representatives:
    class: SmdRefreshJob
    queue: default
    args: [ { limit: 1100, scope: representatives } ]
    schedule: every day at 6am

  smd_refresh_catalogue:
    class: SmdRefreshJob
    queue: default
    args: [ { limit: 8000 } ]
    schedule: every day at 8am

  # Discovery pass over the `hl` sitemap index only (SmdCrawlJob's default
  # catalog) — `ame` and `other` stay untouched. The skip is the cursor, so each
  # run continues where the last stopped. `mode: import` must stay unquoted —
  # `:import` is a YAML syntax error in flow style and takes the whole schedule
  # down with it. All three SMD jobs share one concurrency semaphore, so a late
  # refresh delays this, not races it.
  smd_import_new:
    class: SmdCrawlJob
    queue: default
    args: [ { limit: 1000, mode: import } ]
    schedule: every day at 11am

  # Prices drift and stale ones are quoted to buyers. Rotation is by our own
  # last_crawled_at, not by the shop's updatedAt — 100% of that catalogue carries a
  # July/August 2026 timestamp from its migration, so it says nothing about change.
  # 5000/day cycles a 1.2M-row catalogue in 240 days; raise once the row count is known.
  stretta_refresh:
    class: StrettaRefreshJob
    queue: default
    args: [ { limit: 5000 } ]
    schedule: every day at 7am

  # Converges the free -> Stretta cross-links, the same shape as backfill_smd_matches.
  # Half an hour after it: both hold a database-wide SQLite write lock during their
  # delete-then-insert, and overlapping them stalls every web write twice over.
  backfill_stretta_matches:
    class: BackfillStrettaMatchesJob
    queue: default
    schedule: every day at 12:31pm

  # New arrivals only — products(sortKey: CREATED_AT) is safe at weekly volume,
  # where a full pass would hit the connection's 25,000-element cap.
  stretta_new_releases:
    class: StrettaNewReleasesJob
    queue: default
    schedule: every monday at 5am

