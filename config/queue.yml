default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

# Production: prioritize web UX over job throughput
# CPU-heavy jobs (galleries, thumbnails) run with low concurrency
# to avoid starving web requests of CPU time
production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Memory & CPU-intensive: music21 extraction (Python)
    # Single thread to prevent OOM kills
    - queues:
        - extractions
      threads: 1
      processes: 1
      polling_interval: 0.5

    # CPU-heavy: PDF-to-image conversion (ImageMagick/Ghostscript)
    # 1 thread — each convert uses 200-500MB RAM; concurrent converts OOM the 2GB container
    - queues:
        - galleries
      threads: 1
      processes: 1
      polling_interval: 1

    # Thumbnails: mostly I/O (download image, resize, upload to R2)
    # 4 threads — light on CPU but still writes to SQLite
    - queues:
        - thumbnails
      threads: 4
      processes: 1
      polling_interval: 1

    # I/O-heavy: downloading PDFs from external servers
    # Can overlap network waits, so 2 threads OK
    - queues:
        - pdfs
      threads: 2
      processes: 1
      polling_interval: 0.5

    # Default: batch orchestrators, imports, sitemap, cache, normalize:* jobs
    # Mostly I/O-bound or LLM-call-bound; threads bumped to allow parallel
    # backfill jobs (NormalizeVoicingJob etc.) without starving web.
    - queues:
        - default
      threads: 3
      processes: 1
      polling_interval: 0.5

    # RAG: long-running search_text generation via external LLM (DeepSeek).
    # I/O-bound HTTPS calls; single thread is enough — one bulk job processes
    # scores serially internally and DeepSeek latency is the bottleneck (~3-5s/row).
    - queues:
        - rag
      threads: 1
      processes: 1
      polling_interval: 1
