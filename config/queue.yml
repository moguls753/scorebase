default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

# Production: prioritize web UX over job throughput
# CPU-heavy jobs (galleries, thumbnails) run with low concurrency
# to avoid starving web requests of CPU time
production:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Memory & CPU-intensive: music21 extraction (Python)
    # Single thread to prevent OOM kills
    - queues:
        - extractions
      threads: 1
      processes: 1
      polling_interval: 0.5

    # CPU-heavy: PDF-to-image conversion (ImageMagick/Ghostscript)
    # 1 thread — each convert call pegs a core (2 cores total on server)
    - queues:
        - galleries
      threads: 1
      processes: 1
      polling_interval: 1

    # Thumbnails: mostly I/O (download image, resize, upload to R2)
    # 8 threads — 93% CPU idle with 2, bottleneck is network wait (CX23: 2 vCPU, 4GB)
    - queues:
        - thumbnails
      threads: 8
      processes: 1
      polling_interval: 1

    # I/O-heavy: downloading PDFs from external servers
    # Can overlap network waits, so 2 threads OK
    - queues:
        - pdfs
      threads: 2
      processes: 1
      polling_interval: 0.5

    # Default: batch orchestrators, imports, sitemap, cache
    # Mostly I/O-bound or quick dispatch jobs
    - queues:
        - default
      threads: 2
      processes: 1
      polling_interval: 0.5
