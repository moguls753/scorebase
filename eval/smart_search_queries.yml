# ScoreBase Smart Search — Evaluation Corpus (catalog-aware)
#
# Calibrated against the actual 14,109 indexed PDMX scores. Indexed catalog
# is dominated by Scottish/Irish folk fiddle (Marshall/Skinner/Gow/O'Carolan),
# Renaissance sacred vocal (Lasso/Palestrina/Susato/Dowland/Morley), Baroque
# (Bach/Schütz/Handel), Classical (Mozart/Beethoven), some Romantic (Chopin),
# and Toby Fox video game music. Difficulty grades when present skew Grade 5-8.
