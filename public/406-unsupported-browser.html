<!doctype html>
<html lang="en">
  <head>
    <title>Browser not supported (406)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      :root {
        --color-bg: #1f1b17;
        --color-bg-elevated: #2a2520;
        --color-bg-surface: #352f28;
        --color-accent: #c45a10;
        --color-accent-hover: #e06b1a;
        --color-text: #e8e2d9;
        --color-text-muted: #a89c8c;
        --color-border: #4a4035;
        --border-width: 2px;
        --shadow-card: 4px 4px 0 var(--color-border);
      }

      html { font-size: 16px; }

      body {
        background: var(--color-bg);
        color: var(--color-text);
        display: grid;
        font-family: 'Outfit', -apple-system, sans-serif;
        font-size: clamp(1rem, 2vw, 1.25rem);
        -webkit-font-smoothing: antialiased;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.5;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
      }

      main {
        display: grid;
        gap: 1.5em;
        padding: 2em;
        place-items: center;
        text-align: center;
        max-width: 100%;
      }

      .error-code {
        font-size: clamp(5rem, 20vw, 10rem);
        font-weight: 800;
        line-height: 1;
        color: var(--color-border);
        letter-spacing: -0.04em;
        position: relative;
      }

      .error-code::after {
        content: '406';
        position: absolute;
        left: 4px;
        top: 4px;
        color: #7c3aed;
        z-index: -1;
      }

      .error-label {
        font-size: 0.875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #8b5cf6;
        background: var(--color-bg-elevated);
        padding: 0.5em 1em;
        border: var(--border-width) solid var(--color-border);
        box-shadow: 2px 2px 0 var(--color-border);
        margin-top: -0.5em;
      }

      article {
        width: min(100%, 28em);
      }

      article p {
        color: var(--color-text-muted);
        font-size: 0.95rem;
      }

      article strong {
        color: var(--color-text);
        font-weight: 700;
      }

      .browser-icons {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        margin-top: 0.5rem;
      }

      .browser-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem;
        background: var(--color-bg-elevated);
        border: var(--border-width) solid var(--color-border);
        box-shadow: 3px 3px 0 var(--color-border);
        text-decoration: none;
        color: var(--color-text-muted);
        font-size: 0.75rem;
        font-weight: 600;
        transition: transform 0.1s ease, box-shadow 0.1s ease, color 0.15s ease;
      }

      .browser-link:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 5px 0 var(--color-border);
        color: var(--color-accent);
      }

      .browser-link svg {
        width: 2rem;
        height: 2rem;
      }

      .btn-home {
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.875em 1.75em;
        background: var(--color-accent);
        color: #fff;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-decoration: none;
        border: var(--border-width) solid var(--color-accent);
        box-shadow: 4px 4px 0 var(--color-border);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        cursor: pointer;
      }

      .btn-home:hover {
        background: var(--color-accent-hover);
        border-color: var(--color-accent-hover);
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--color-border);
      }

      .btn-home:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--color-border);
      }

      .btn-home svg {
        width: 1.125em;
        height: 1.125em;
      }

      .music-note {
        position: fixed;
        font-size: 2rem;
        color: var(--color-border);
        opacity: 0.4;
        pointer-events: none;
      }

      .note-1 { top: 15%; left: 10%; transform: rotate(-15deg); }
      .note-2 { top: 25%; right: 12%; transform: rotate(10deg); }
      .note-3 { bottom: 20%; left: 15%; transform: rotate(5deg); }
      .note-4 { bottom: 30%; right: 10%; transform: rotate(-8deg); }

      @media (max-width: 640px) {
        .music-note { display: none; }
        .browser-icons { gap: 1rem; }
        .browser-link { padding: 0.75rem; }
        .browser-link svg { width: 1.5rem; height: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <div class="music-note note-1">&#9834;</div>
    <div class="music-note note-2">&#9835;</div>
    <div class="music-note note-3">&#9833;</div>
    <div class="music-note note-4">&#9839;</div>

    <main>
      <div class="error-code">406</div>
      <div class="error-label">Unsupported Browser</div>
      <article>
        <p><strong>Your browser isn't supported.</strong> Please upgrade to a modern browser to use ScoreBase.</p>
        <div class="browser-icons">
          <a href="https://www.google.com/chrome/" class="browser-link" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><circle cx="12" cy="12" r="4"/></svg>
            Chrome
          </a>
          <a href="https://www.mozilla.org/firefox/" class="browser-link" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            Firefox
          </a>
          <a href="https://www.apple.com/safari/" class="browser-link" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5.5-2.5l7.51-3.49L17.5 6.5 9.99 9.99 6.5 17.5zm5.5-6.6c.61 0 1.1.49 1.1 1.1s-.49 1.1-1.1 1.1-1.1-.49-1.1-1.1.49-1.1 1.1-1.1z"/></svg>
            Safari
          </a>
        </div>
      </article>
      <a href="/" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Try Anyway
      </a>
    </main>
  </body>
</html>
